openapi: 3.0.3
info:
  title: Case Document Management API
  version: 1.0.0
  description: Contracts for case document list/upload/delete flows.
servers:
  - url: /api
paths:
  /cases/{id}/documents:
    get:
      summary: List documents for a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document list for case
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CaseDocumentItem'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      summary: Upload a document for a case
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, documentType]
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  $ref: '#/components/schemas/DocumentType'
                note:
                  type: string
                  maxLength: 2000
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDocumentItem'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /cases/{id}/documents/{docId}:
    delete:
      summary: Delete case document (shared documents delete across linked cases)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: docId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                  deletedCount:
                    type: integer
                    description: Number of DB document rows removed (>=1).
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
components:
  responses:
    ErrorResponse:
      description: Consistent error shape
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              details:
                type: object
                additionalProperties: true
  schemas:
    DocumentType:
      type: string
      enum:
        - POLICY_DOCUMENT
        - BILL_OF_LADING
        - COMMERCIAL_INVOICE
        - PACKING_LIST
        - CERTIFICATE_OF_INSURANCE
        - SURVEY_REPORT
        - CLAIM_FORM
        - ENDORSEMENT
        - DEBIT_NOTE
        - CREDIT_NOTE
        - OTHER
    CaseDocumentItem:
      type: object
      required:
        - id
        - caseId
        - name
        - mimeType
        - fileSize
        - type
        - uploadedAt
        - isShared
      properties:
        id:
          type: string
        caseId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/DocumentType'
        mimeType:
          type: string
        fileSize:
          type: integer
        note:
          type: string
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        isShared:
          type: boolean
        bulkUploadId:
          type: string
          nullable: true
        downloadUrl:
          type: string
          description: Server-resolved path/URL for download action.
