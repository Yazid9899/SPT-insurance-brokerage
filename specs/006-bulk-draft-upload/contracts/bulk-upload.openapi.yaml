openapi: 3.0.3
info:
  title: Bulk Draft Upload API
  version: 1.0.0
  description: Contracts for temporary shared document upload and final transactional bulk draft creation.
servers:
  - url: /api
paths:
  /cases/bulk-upload/temp-documents:
    post:
      summary: Upload temporary shared documents for a bulk draft wizard session
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [draftId, files]
              properties:
                draftId:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Temporary document references
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TempDocumentRef'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /cases/bulk-upload:
    post:
      summary: Validate and create draft cases from reviewed batch (all-or-nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUploadCreateRequest'
      responses:
        '201':
          description: Batch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUploadCreateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
components:
  responses:
    ErrorResponse:
      description: Consistent error shape
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              details:
                type: object
                additionalProperties: true
  schemas:
    TempDocumentRef:
      type: object
      required: [tempDocId, fileName, mimeType, fileSize]
      properties:
        tempDocId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
    ColumnMapping:
      type: object
      required: [targetField, sourceHeader, sourceColumnIndex]
      properties:
        targetField:
          type: string
          enum: [origin, destination, vessel, quantity, sumInsured, etd, eta, notes]
        sourceHeader:
          type: string
        sourceColumnIndex:
          type: integer
          minimum: 0
    ShipmentRowInput:
      type: object
      required: [rowIndex, origin, destination, vessel, quantity, sumInsured, etd]
      properties:
        rowIndex:
          type: integer
          minimum: 1
        origin:
          type: string
        destination:
          type: string
        vessel:
          type: string
        quantity:
          type: string
        sumInsured:
          type: string
        etd:
          type: string
          format: date
        eta:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
    BulkUploadCreateRequest:
      type: object
      required: [openCoverId, clientRate, mappings, rows]
      properties:
        openCoverId:
          type: string
        clientRate:
          type: string
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMapping'
        rows:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ShipmentRowInput'
        tempDocumentIds:
          type: array
          items:
            type: string
    BulkUploadCreateResponse:
      type: object
      required: [bulkUploadId, caseCount, caseIds, redirectTo, totals]
      properties:
        bulkUploadId:
          type: string
        caseCount:
          type: integer
        caseIds:
          type: array
          items:
            type: string
        redirectTo:
          type: string
          example: /cases?bulkUploadId=bulk_20260326_001
        totals:
          type: object
          required: [sumInsured, clientPremium, insurerPremium, brokerCommission]
          properties:
            sumInsured:
              type: string
            clientPremium:
              type: string
            insurerPremium:
              type: string
            brokerCommission:
              type: string
